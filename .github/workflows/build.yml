name: build
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
      - run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Hypercube
          path: dist/Hypercube.exe
